services:
  web-compose-short:
    image: nginx:latest
    ports:
      - "8083:80"
    volumes:
      - ./test_web:/usr/share/nginx/html

  web-compose-long:
    image: nginx:latest
    ports:
      - "8084:80"
    volumes:
      - type: bind
        source: ./test_web
        target: /usr/share/nginx/html
