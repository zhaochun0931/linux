services:
  postgres:
    image: postgres:15-alpine
    container_name: pg-bindmount-test
    restart: always
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      # 使用 Bind Mount：将宿主机当前目录下的 ./pgdata 映射到容器内的数据目录
      - ./pgdata:/var/lib/postgresql/data
