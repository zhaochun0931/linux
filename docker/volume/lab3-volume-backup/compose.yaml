services:
  postgres:
    image: postgres:15-alpine
    container_name: pg-volume-test
    restart: always
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      # 使用命名卷格式：<volume_name>:<container_path>
      - pg-data-volume:/var/lib/postgresql/data

# 必须在顶层声明所有的命名卷
volumes:
  pg-data-volume:
